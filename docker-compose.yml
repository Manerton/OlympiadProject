# version: '3.9'

services:
  app:
    build:
      context: ./docker/php
    container_name: olymp
    working_dir: /var/www/html
    volumes:
      - ./olymp-admin:/var/www/html
    networks:
      - olympic

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./olymp-admin:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - olympic

  db:
    image: mariadb:10.11
    container_name: olymp_admin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - olympic

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: olymp_admin_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - olympic

  redis:
    image: redis:latest
    container_name: olymp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - olympic

  rabbitmq:
    image: rabbitmq:management
    container_name: olymp_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - olympic

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    container_name: olymp_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - olympic
    ulimits:
      memlock:
        soft: -1
        hard: -1

  grafana:
    image: grafana/grafana:latest
    container_name: olymp_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - olympic
    depends_on:
      - elasticsearch

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - olympic

 
  loki-init:
    image: busybox
    command: ["sh", "-c", "mkdir -p /data/chunks /data/index /data/cache /data/compactor"]
    volumes:
      - loki-data:/data
    restart: "no"

  loki:
    image: grafana/loki:2.9.0
    depends_on:
      - loki-init
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - olympic

networks:
  olympic:

volumes:
  loki-data:
  event-db-data:
  sso-db-data:
  jury-db-data:
  db_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  grafana_data: