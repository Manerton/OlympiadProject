version: '3.9'

services:
  app:
    build:
      context: ./docker/php
    container_name: olymp
    working_dir: /var/www/html
    volumes:
      - ./olymp-admin:/var/www/html
    networks:
      - olympic

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./olymp-admin:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - olympic

  db:
    image: mariadb:10.11
    container_name: olymp_admin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - olympic

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: olymp_admin_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - olympic
  redis:
    image: redis:latest
    container_name: olymp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - olympic

  rabbitmq:
    image: rabbitmq:management
    container_name: olymp_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - olympic

networks:
  olympic:

volumes:
  db_data:
  redis_data:
  rabbitmq_data: