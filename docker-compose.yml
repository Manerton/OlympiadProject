# version: '3.9'

services:
  event-db:
    image: postgres:16
    container_name: event-db
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_DB: EventServiceDB
    ports:
      - "5433:5432"
    networks:
      - olympic
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d EventServiceDB"]
      interval: 5s
      timeout: 3s
      retries: 5

  event-service:
    build:
      context: ./event-service
    container_name: event-service
    depends_on:
      event-db:
        condition: service_healthy
    environment:
      DSN: "postgres://event_user:event_pass@event-db:5432/EventServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8888:8080"
    entrypoint: ["/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./event-service"]

  sso-db:
    image: postgres:16
    container_name: sso-db
    environment:
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: sso_pass
      POSTGRES_DB: SSOServiceDB
    ports:
      - "5444:5432"
    networks:
      - olympic
    volumes:
      - sso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d SSOServiceDB"]
      interval: 5s
      timeout: 3s
      retries: 5

  sso-service:
    build:
      context: ./sso-service
    container_name: sso-service
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      DSN: "postgres://sso_user:sso_pass@sso-db:5432/SSOServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8989:8181"
    entrypoint: ["/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./sso-service"]

  jury-db:
    image: postgres:16
    container_name: jury-db
    environment:
      POSTGRES_USER: jury_user
      POSTGRES_PASSWORD: jury_pass
      POSTGRES_DB: JureAssignmentsServiceDB
    ports:
      - "5445:5432"
    networks:
      - olympic
    volumes:
      - jury-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jury_user -d JureAssignmentsServiceDB"]
      interval: 5s
      timeout: 3s
      retries: 5

  jury-service:
    build:
      context: ./Jure-assignments-service
    container_name: jury-service
    depends_on:
      jury-db:
        condition: service_healthy
    environment:
      DSN: "postgres://jury_user:jury_pass@jury-db:5432/JureAssignmentsServiceDB?sslmode=disable"
      MIGRATION_PATH: "/app/migrations"
      CONFIG_PATH: "/app/config-yaml/docker.yaml"
    networks:
      - olympic
    ports:
      - "8383:8090"
    entrypoint: ["/bin/sh", "-c", "./migrator -dsn \"$DSN\" -migration-path \"$MIGRATION_PATH\" up && ./jury-ass-service"]

  app:
    build:
      context: ./docker/php
    container_name: olymp
    working_dir: /var/www/html
    volumes:
      - ./olymp-admin:/var/www/html
    networks:
      - olympic

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ./olymp-admin:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - olympic

  db:
    image: mariadb:10.11
    container_name: olymp_admin_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - olympic

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: olymp_admin_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - olympic

  redis:
    image: redis:latest
    container_name: olymp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - olympic

  rabbitmq:
    image: rabbitmq:management
    container_name: olymp_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - olympic

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    container_name: olymp_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - olympic
    ulimits:
      memlock:
        soft: -1
        hard: -1

  grafana:
    image: grafana/grafana:latest
    container_name: olymp_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - olympic
    depends_on:
      - elasticsearch

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - olympic

  prometheus:
    image: prom/prometheus:latest
    container_name: olymp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - olympic
  loki-init:
    image: busybox
    command: ["sh", "-c", "mkdir -p /data/chunks /data/index /data/cache /data/compactor"]
    volumes:
      - loki-data:/data
    restart: "no"

  loki:
    image: grafana/loki:2.9.0
    depends_on:
      - loki-init
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - olympic

networks:
  olympic:

volumes:
  loki-data:
  event-db-data:
  sso-db-data:
  jury-db-data:
  db_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  grafana_data: