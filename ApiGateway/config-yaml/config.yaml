env: "dev"

HTTP_SERVER_INFO:
  routes:
    - prefix: "/regional-stages"
      aggregate: false
      target: "http://172.16.1.39:8080/api/events/regional-stage"
      skip_auth: false
    - prefix: "/events-child"
      aggregate: false
      target: "http://172.16.1.39:8080/api/events/child"
      skip_auth: false
    - prefix: "/auth"
      aggregate: false
      target: "http://172.16.1.39:8181/api/users/login"
      skip_auth: true
    - prefix: "/register"
      aggregate: false
      target: "http://172.16.1.39:8181/api/users/register"
      skip_auth: true
    - prefix: "/refresh"
      aggregate: false
      target: "http://172.16.1.39:8181/api/users/refresh"
      skip_auth: true  
    - prefix: "/logout"
      aggregate: false
      target: "http://172.16.1.39:8181/api/users/logout"
      skip_auth: true  
    - prefix: "/aplicationevent"
      aggregate: true
      services:
        - "http://172.16.0.196:8082/applications"
        - "http://172.16.1.39:8080/api/events"
      skip_auth: true
      roles: []

JWT_TEMP_INFO:
  key: "lololololololololololololololololololololololololololololol"

REDIS_INFO:
  address_path: "redis:6379"

RABBIT_INFO:
  address_path: "amqp://app:test@172.16.0.94:5672/"
  queue_name: "olymp_application"
