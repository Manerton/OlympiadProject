env: "dev"

HTTP_SERVERS_INFO:
  routes:
    # ==================== AUTH SERVICE (8181) ====================
    - prefix: "/auth"
      aggregate: false
      target: "http://sso-service:8181/api/users/login"
      skip_auth: true

    - prefix: "/logout"
      aggregate: false
      target: "http://sso-service:8181/api/users/logout"
      skip_auth: false

    - prefix: "/refresh"
      aggregate: false
      target: "http://sso-service:8181/api/users/refresh"
      skip_auth: true

    - prefix: "/register"
      aggregate: false
      target: "http://sso-service:8181/api/users/register"
      skip_auth: true

    - prefix: "/revoke-all"
      aggregate: false
      target: "http://sso-service:8181/api/users/revoke-all"
      skip_auth: false

    - prefix: "/users/"
      aggregate: false
      target: "http://sso-service:8181/api/users"
      skip_auth: false

    - prefix: "/users/count"
      aggregate: false
      target: "http://sso-service:8181/api/users/count"
      skip_auth: false

    - prefix: "/users/change-password/"
      aggregate: false
      target: "http://sso-service:8181/api/users/change-password/"
      skip_auth: false
    
    - prefix: "/users/forgot-password/"
      aggregate: false
      target: "http://sso-service:8181/api/users/forgot-password"
      skip_auth: false

    - prefix: "/users/all-info/"
      aggregate: false
      target: "http://sso-service:8181/api/users/"
      skip_auth: false

    - prefix: "/users/participant/all-info/"
      aggregate: false
      target: "http://sso-service:8181/api/users/all-info/"
      skip_auth: false

    # ==================== PARTICIPANTS & SCHOOLS SERVICE (8181) ====================
    - prefix: "/participants/"
      aggregate: false
      target: "http://sso-service:8181/api/participants"
      skip_auth: false

    - prefix: "/participants/byuser/"
      aggregate: false
      target: "http://sso-service:8181/api/participants/byuser"
      skip_auth: false

    - prefix: "/participants/count"
      aggregate: false
      target: "http://sso-service:8181/api/participants/count"
      skip_auth: false

    - prefix: "/schools/"
      aggregate: false
      target: "http://sso-service:8181/api/schools"
      skip_auth: false

    - prefix: "/schools"
      aggregate: false
      target: "http://sso-service:8181/api/schools"
      skip_auth: true

    - prefix: "/schools/count"
      aggregate: false
      target: "http://sso-service:8181/api/schools/count"
      skip_auth: false

    # ==================== EVENTS SERVICE (8080) ====================
    - prefix: "/events/"
      aggregate: false
      target: "http://event-service:8080/api/events"
      skip_auth: true

    - prefix: "/events/change"
      aggregate: false
      target: "http://event-service:8080/api/events"
      skip_auth: false

    - prefix: "/events/child/"
      aggregate: false
      target: "http://event-service:8080/api/events/child"
      skip_auth: true

    - prefix: "/events/stages/"
      aggregate: false
      target: "http://event-service:8080/api/events/stages"
      skip_auth: true

    - prefix: "/events/class/"
      aggregate: false
      target: "http://event-service:8080/api/events/class"
      skip_auth: false

    - prefix: "/events/subjects/"
      aggregate: false
      target: "http://event-service:8080/api/events/subjects"
      skip_auth: false

    - prefix: "/regional-stages"
      aggregate: false
      target: "http://event-service:8080/api/events/regional-stage"
      skip_auth: true

    # ==================== APPLICATIONS SERVICE (8082) ====================
    - prefix: "/applications/"
      aggregate: false
      target: "http://application-service:8082/applications"
      skip_auth: false

    - prefix: "/applications/count"
      aggregate: false
      target: "http://application-service:8082/applicationsCount"
      skip_auth: false

    - prefix: "/applications/event/"
      aggregate: false
      target: "http://application-service:8082/applications/event/"
      skip_auth: false

    - prefix: "/applications/user/"
      aggregate: false
      target: "http://application-service:8082/applications/user/"
      skip_auth: false

    # ==================== JURY SERVICE (8090) ====================
    - prefix: "/jury-assignments/event/"
      aggregate: false
      target: "http://jury-service:8090/api/jury-assignments/event"
      skip_auth: false

    # ==================== Olimp-admin SERVICE ====================
    - prefix: "/appeal/store"
      aggregate: false
      target: "http://nginx_server/api/appeal/store"
      skip_auth: false

    - prefix: "/email/send-code"
      aggregate: false
      target: "http://nginx_server/index.php?r=api%2email%2Fsend-code"
      skip_auth: false

    - prefix: "/appeal/change-status/"
      aggregate: false
      target: "http://nginx_server/api/appeal/change-status"
      skip_auth: false

    - prefix: "/appeal/appeal-by-event/"
      aggregate: false
      target: "http://nginx_server/api/appeal/appeal-by-event"
      skip_auth: false

    - prefix: "/appeal/appeal-by-user/"
      aggregate: false
      target: "http://nginx_server/api/appeal/appeal-by-user"
      skip_auth: false

    - prefix: "/appeal/appeal-event-user/"
      aggregate: false
      target: "http://nginx_server/api/appeal/appeal-event-user"
      skip_auth: false

    - prefix: "/result/result-by-attendance/"
      aggregate: false
      target: "http://nginx_server/api/result/result-by-attendance"
      skip_auth: false

    - prefix: "/result/result-by-user/"
      aggregate: false
      target: "http://nginx_server/api/result/result-by-user"
      skip_auth: false

    - prefix: "/result/result-by-user-type-event/"
      aggregate: false
      target: "http://nginx_server/api/result/result-by-user-type-event"
      skip_auth: false
    
    - prefix: "/result/result-by-event-user/"
      aggregate: false
      target: "http://nginx_server/api/result/result-by-event-user"
      skip_auth: false

    # ==================== AGGREGATE ROUTES ====================
    - prefix: "/AplicationEvent"
      aggregate: true
      services:
        - "http://application-service:8082/applications"
        - "http://event-service:8080/api/events"
      skip_auth: true
      roles: []

    - prefix: "/ApplicationEventtest/"
      aggregate: true
      targets:
        - url: "http://application-service:8082/applications/user/"
          fields: ["id", "status"]
        - url: "http://event-service:8080/api/events/list/"
          fields: ["id", "name", "start_date", "end_date", "previous_event_id", "subject", "class_number", "additional_info"]
      skip_auth: false
      roles: []

    - prefix: "/ApplicationEvent/"
      aggregate: true
      targets:
        - url: "http://application-service:8082/applications/user/"
          fields: [""]
        - url: "http://event-service:8080/api/events/list"
          fields: [""]
      skip_auth: false
      roles: []

    - prefix: "/history-event/"
      aggregate: true
      targets:
        - url: "http://nginx_server/api/result/events-by-user/"
          fields: [""]
        - url: "http://event-service:8080/api/events/list"
          fields: [""]
      skip_auth: false
      roles: []
    
    - prefix: "/events-appeal/"
      aggregate: true
      targets:
        - url: "http://nginx_server/api/appeal/events-appeal/"
          fields: [""]
        - url: "http://event-service:8080/api/events/list"
          fields: [""]
      skip_auth: false
      roles: []

CORS_INFO:
  allow_origins: [
    http://localhost:5173,
    http://vision:5173
  ]

HTTP_SERVER_MAIN_INFO:
  address: "0.0.0.0"
  port: "6611"

JWT_TEMP_INFO:
  key: "lololololololololololololololololololololololololololololol"

REDIS_INFO:
  address_path: "redis:6379"

RABBIT_INFO:
  address_path: "amqp://guest:guest@rabbitmq:5672/"
  queue_name: "olymp_application"