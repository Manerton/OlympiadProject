version: '3.9'

services:
  db:
    image: postgres:15
    container_name: event_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: EventServiceDB
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_service_app
    environment:
      - CONFIG_PATH=/app/config-yaml/local.yaml
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./config-yaml:/app/config-yaml:ro

volumes:
  db_data:
