server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
      - json:
          source: log
          expressions:
            time: time
            level: level
            msg: msg
            service: service
            owner: owner
            op: op
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          level:
          service:
          owner:
          op:
          stream:
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream